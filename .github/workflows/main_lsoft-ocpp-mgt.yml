# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - lsoft-ocpp-mgt

# Push trigger disabled during the move to the Raspberry Pi (see docs/MIGRATIE-PI.md):
# main now targets .NET 10/SQLite and must not be deployed to Azure anymore.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build OCPP.Core.Management/OCPP.Core.Management.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish OCPP.Core.Management/OCPP.Core.Management.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5D0011CD87E144DEA2ADDBA5C1915D21 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5941DB72D03F42748A3AC2ADC84F093E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5610DCEB6EF4408FBF30399F74E83154 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'lsoft-ocpp-mgt'
          slot-name: 'Production'
          package: .